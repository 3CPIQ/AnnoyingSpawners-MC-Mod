name: Build Annoying Spawners

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct source archive
        run: cat build-source/chunk*.b64 | base64 --decode > AnnoyingSpawners-0.1.0-source.zip

      - name: Extract source
        run: unzip -q AnnoyingSpawners-0.1.0-source.zip -d extracted

      - name: Apply 0.1.1 fixes
        run: |
          base64 --decode patches/v0.1.1rel.full.b64 | gunzip > v0.1.1.raw.patch
          sed -e 's#a/oldsrc/AnnoyingSpawners/#a/#g' -e 's#b/AnnoyingSpawners/#b/#g' v0.1.1.raw.patch > v0.1.1.patch
          cd extracted/AnnoyingSpawners
          patch -p1 < ../../v0.1.1.patch

      - name: Apply 0.1.2 autocomplete fixes
        env:
          PATCH_012_B64: 
        run: |
          printf '%s' "$PATCH_012_B64" | base64 --decode | gunzip > /tmp/v0.1.2.patch
          cd extracted/AnnoyingSpawners
          patch -p1 < /tmp/v0.1.2.patch

      - name: Build Forge mod
        working-directory: extracted/AnnoyingSpawners
        run: gradle build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AnnoyingSpawners-0.1.2-Forge-1.20.1
          path: extracted/AnnoyingSpawners/build/libs/*.jar
          if-no-files-found: error
