name: Build Annoying Spawners

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: cat build-source/chunk*.b64 | base64 --decode > AnnoyingSpawners-0.1.0-source.zip

      - name: Extract source
        run: unzip -q AnnoyingSpawners-0.1.0-source.zip -d extracted

      - name: Apply 0.1.1 fixes
        run: |
          base64 --decode patches/v0.1.1rel.full.b64 | gunzip > v0.1.1.raw.patch
          sed -e 's#a/oldsrc/AnnoyingSpawners/#a/#g' -e 's#b/AnnoyingSpawners/#b/#g' v0.1.1.raw.patch > v0.1.1.patch
          cd extracted/AnnoyingSpawners
          patch -p1 < ../../v0.1.1.patch

      - name: Pack exact 0.1.1 source
        run: |
          cd extracted
          zip -qr ../AnnoyingSpawners-0.1.1-workflow-source.zip AnnoyingSpawners

      - name: Upload exact 0.1.1 source
        uses: actions/upload-artifact@v4
        with:
          name: AnnoyingSpawners-0.1.1-workflow-source
          path: AnnoyingSpawners-0.1.1-workflow-source.zip
          if-no-files-found: error
